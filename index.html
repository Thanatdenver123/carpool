                  </div>
                  {Bus && <Bus className="absolute -bottom-10 -right-10 w-48 h-48 opacity-10 rotate-12" />}
                </div>
                
                <section className="space-y-4">
                  <h3 className="font-bold flex items-center gap-2 px-2 text-slate-700 uppercase italic">{ClipboardList && <ClipboardList className="w-5 h-5 text-blue-600" />} สถานะการเดินทาง</h3>
                  {myBookings.filter(b => b.status !== 'Archived' && b.status !== 'Cancelled').map(b => {
                    const route = routes.find(r => String(r.id) === String(b.route_id));
                    const { type: tType, pickup, subText } = parseTripData(b.trip_type);
                    const isOneWay = tType !== 'round-trip';
                    
                    let basePrice = route?.price || 0;
                    if (route?.vehicle_type === 'รถบัส') {
                        const parts = getCarModelParts(route?.car_model);
                        if (subText === 'รายสัปดาห์' && parts.weeklyPrice) basePrice = parseFloat(parts.weeklyPrice);
                        else if (subText === 'รายสัปดาห์') basePrice = 225;
                        
                        if (subText === 'รายเดือน' && parts.monthlyPrice) basePrice = parseFloat(parts.monthlyPrice);
                        else if (subText === 'รายเดือน') basePrice = 900;
                    }
                    const finalPrice = isOneWay && !subText ? basePrice / 2 : basePrice;

                    return (
                      <div key={b.id} className="bg-white p-6 rounded-[2.5rem] border border-slate-100 shadow-sm space-y-4 transition-all hover:shadow-xl">
                        <div className="flex justify-between items-start">
                          <div>
                            <h4 className="font-black text-blue-900 text-lg italic uppercase tracking-tighter">{route?.name || "สายรถที่เลือก"}</h4>
                            <div className="flex flex-wrap gap-2 mt-2">
                              <span className="text-[10px] text-slate-500 font-bold uppercase bg-slate-50 px-3 py-1 rounded-lg border">{getTripTypeText(tType)} {subText && `(${subText})`}</span>
                              <span className="text-[10px] text-indigo-600 font-bold uppercase bg-indigo-50 px-3 py-1 rounded-lg border border-indigo-100 flex items-center gap-1">{Calendar && <Calendar className="w-3 h-3"/>} {route?.trip_date || "N/A"}</span>
                              {route?.price && <span className="text-[10px] text-green-600 font-bold uppercase bg-green-50 px-3 py-1 rounded-lg border border-green-100 flex items-center gap-1">{Banknote && <Banknote className="w-3 h-3"/>} {finalPrice}฿</span>}
                            </div>
                            {pickup && <p className="text-[10px] text-blue-600 font-black mt-2 bg-blue-50 inline-block px-2 py-0.5 rounded border border-blue-100">จุดรับ: {pickup}</p>}
                          </div>
                          <div className="flex gap-2 items-start">
                            <span className={`px-4 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest ${b.status === 'Approved' ? 'bg-green-100 text-green-700 border border-green-200' : b.status === 'Pending' ? 'bg-yellow-100 text-yellow-700 border border-yellow-200' : 'bg-red-50 text-red-700 border border-red-100'}`}>
                              {b.status === 'Approved' ? '✅ อนุมัติแล้ว' : b.status === 'Pending' ? '⏳ รอยืนยัน' : '❌ ปฏิเสธ'}
                            </span>
                            <button onClick={() => cancelBooking(b.id)} className="p-3 bg-slate-50 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-xl transition-all border border-slate-200 shadow-sm" title="ยกเลิกการจอง">{Trash2 && <Trash2 className="w-5 h-5" />}</button>
                          </div>
                        </div>

                        {/* REAL LIVE GPS MAP */}
                        {b.status === 'Approved' && (
                          <div className="pt-4 border-t border-slate-50">
                            <div className="flex items-center justify-between mb-4">
                                <p className="text-[9px] font-black text-slate-400 uppercase tracking-[0.2em] flex items-center gap-2">
                                    {Navigation && <Navigation className="w-4 h-4 text-blue-600 animate-pulse" />} Live GPS Tracking
                                </p>
                            </div>
                            <RealLiveMap rawData={route?.car_model} forEmployee={true} vehicleType={route?.vehicle_type} />
                          </div>
                        )}
                      </div>
                    );
                  })}
                  {myBookings.filter(b => b.status !== 'Archived' && b.status !== 'Cancelled').length === 0 && <div className="p-24 text-center bg-white rounded-[3rem] border-2 border-dashed border-slate-200 text-slate-300 font-black italic uppercase tracking-widest">No Active Trip Found</div>}
            </section>
          </div>
        )}

        {}
        {/* ADMIN DASHBOARD */}
        {view === 'admin-dash' && (
          <div className="space-y-6 animate-in fade-in duration-500">
            <div className="flex justify-between items-center px-2">
                <h2 className="text-2xl font-black flex items-center gap-3 text-slate-800 uppercase italic">{ShieldCheck && <ShieldCheck className="w-8 h-8 text-blue-700" />} Admin Monitor</h2>
            </div>
            
            {/* Admin Tabs */}
            <div className="flex gap-2 bg-slate-200 p-1.5 rounded-2xl">
               <button onClick={()=>setAdminTab('active')} className={`flex-1 py-3 rounded-xl text-xs font-black uppercase tracking-widest transition-all ${adminTab==='active'?'bg-white text-blue-700 shadow-sm':'text-slate-500 hover:bg-slate-300'}`}>รายการปัจจุบัน</button>
               <button onClick={()=>setAdminTab('history')} className={`flex-1 py-3 rounded-xl text-xs font-black uppercase tracking-widest transition-all ${adminTab==='history'?'bg-white text-slate-700 shadow-sm':'text-slate-500 hover:bg-slate-300'}`}>ประวัติย้อนหลัง</button>
            </div>

            {/* Export Button for History Tab */}
            {adminTab === 'history' && (
              <div className="flex justify-end px-2">
                 <button onClick={exportToExcel} className="bg-emerald-600 text-white px-4 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest shadow-lg flex items-center gap-2 hover:bg-emerald-700 transition-colors">
                    {Download && <Download className="w-4 h-4" />} ดาวน์โหลด Excel (CSV)
                 </button>
              </div>
            )}

            <section className="space-y-3">
               {allBookings
                 .filter(b => {
                    const route = routes.find(r => String(r.id) === String(b.route_id));
                    const { isArchived } = getCarModelParts(route?.car_model);
                    const isPast = route ? (route.trip_date < getTodayDateStr() || isArchived) : true; 
                    const isArchivedStatus = b.status === 'Cancelled' || b.status === 'Archived';
                    
                    if (adminTab === 'active') return !isPast && !isArchivedStatus;
                    else return isPast || isArchivedStatus;
                 })
                 .map(b => {
                 const route = routes.find(r => String(r.id) === String(b.route_id));
                 const { type: tType, pickup, subText } = parseTripData(b.trip_type);

                 return (
                    <div key={b.id} className={`p-5 rounded-[2rem] border shadow-sm flex flex-wrap justify-between items-center gap-4 transition-all ${adminTab==='history' ? 'bg-slate-50 opacity-80' : 'bg-white hover:border-blue-100'}`}>
                        <div className="flex items-center gap-3">
                           <div className={`w-12 h-12 rounded-2xl flex items-center justify-center font-black text-lg ${adminTab==='history'?'bg-slate-200 text-slate-400':'bg-blue-100 text-blue-600'}`}>{b.passenger_name?.[0]}</div>
                           <div>
                              <p className="font-bold text-sm text-slate-800">{b.passenger_name}</p>
                              <div className="flex items-center gap-2 mt-1">
                                <p className="text-[9px] text-slate-500 font-black uppercase tracking-widest">{Phone && <Phone className="w-3 h-3 inline"/>} {b.passenger_phone}</p>
                                <p className="text-[9px] text-indigo-500 font-black uppercase bg-indigo-50 px-2 py-0.5 rounded-md">{route?.trip_date || "N/A"}</p>
                                <p className="text-[9px] text-slate-400 font-black uppercase border px-2 py-0.5 rounded-md">{getTripTypeText(tType)} {subText && `(${subText})`}</p>
                              </div>
                              {pickup && <p className="text-[9px] text-blue-600 font-black mt-1 bg-blue-50 inline-block px-2 py-0.5 rounded">จุดรับ: {pickup}</p>}
                           </div>
                        </div>
                        <div className="flex gap-2 items-center">
                           <span className={`text-[9px] font-black uppercase tracking-widest px-3 py-1.5 rounded-lg ${b.status==='Approved'?'bg-green-100 text-green-700':b.status==='Pending'?'bg-yellow-100 text-yellow-700':'bg-slate-200 text-slate-500'}`}>{b.status === 'Approved' ? '✅ อนุมัติแล้ว' : b.status}</span>
                           {adminTab === 'active' && (
                             <>
                               <button onClick={() => updateBookingStatus(b.id, 'Approved')} className="p-2 bg-green-50 text-green-600 rounded-lg hover:bg-green-600 hover:text-white">{CheckCircle && <CheckCircle className="w-4 h-4"/>}</button>
                               <button onClick={() => updateBookingStatus(b.id, 'Rejected')} className="p-2 bg-red-50 text-red-500 rounded-lg hover:bg-red-500 hover:text-white">{X && <X className="w-4 h-4"/>}</button>
                               <button onClick={() => cancelBooking(b.id)} className="p-2 bg-slate-100 text-slate-400 rounded-lg hover:bg-red-50 hover:text-red-500">{Trash2 && <Trash2 className="w-4 h-4"/>}</button>
                             </>
                           )}
                        </div>
                    </div>
                 )
               })}
               {allBookings.filter(b => {
                    const route = routes.find(r => String(r.id) === String(b.route_id));
                    const { isArchived } = getCarModelParts(route?.car_model);
                    const isPast = route ? (route.trip_date < getTodayDateStr() || isArchived) : true;
                    const isArchivedStatus = b.status === 'Cancelled' || b.status === 'Archived';
                    return adminTab === 'active' ? (!isPast && !isArchivedStatus) : (isPast || isArchivedStatus);
                 }).length === 0 && (
                 <div className="p-16 text-center text-slate-400 font-bold bg-white rounded-3xl border border-dashed">ไม่พบข้อมูลในหมวดหมู่นี้</div>
               )}
            </section>
          </div>
        )}

        {}
        {/* BOOKING LIST VIEW (SEARCH BY DATE) */}
        {view === 'booking' && (
          <div className="space-y-6">
            <h2 className="text-2xl font-black text-blue-900 py-2 flex items-center gap-3 italic uppercase tracking-tighter">
               <button onClick={()=>setView('user-dash')} className="p-2 bg-white rounded-full border shadow-sm transition-transform active:scale-90">{ChevronLeft && <ChevronLeft className="w-5 h-5"/>}</button> ค้นหาสายรถ
            </h2>
            
            {/* Search Filter Box */}
            <div className="bg-white p-6 rounded-[2.5rem] border shadow-lg">
                <label className="text-xs font-black text-slate-500 uppercase tracking-widest ml-2 flex items-center gap-2 mb-2">{Calendar && <Calendar className="w-4 h-4"/>} เลือกวันที่ต้องการเดินทาง (จองล่วงหน้า 1 วันขึ้นไป)</label>
                <input 
                  type="date" 
                  min={getFutureDateStr(1)} 
                  value={searchDate} 
                  onChange={(e) => setSearchDate(e.target.value)}
                  className="w-full bg-blue-50 text-blue-700 text-lg font-black px-6 py-4 rounded-2xl outline-none border-2 border-blue-100 focus:border-blue-400"
                />
            </div>

            <div className="space-y-4">
              {routes.filter(r => r.trip_date === searchDate && !getCarModelParts(r.car_model).isArchived).map(r => {
                const available = getSeats(r);
                const { busPackage } = getCarModelParts(r.car_model);
                
                return (
                  <div key={r.id} className="bg-white rounded-[2.5rem] p-6 border shadow-sm hover:border-blue-500 transition-all cursor-pointer group" onClick={()=>{setSelectedRoute(r); setShowModal(true);}}>
                      <div className="flex flex-col sm:flex-row gap-5">
                        <div className="flex gap-2 shrink-0">
                          <div className="bg-blue-600 text-white w-14 h-14 rounded-2xl flex flex-col items-center justify-center font-black shadow-lg shadow-blue-100 text-[10px]"><span className="opacity-70 text-[7px] uppercase tracking-tighter">ไป</span>{r.departure_time}</div>
                          <div className="bg-indigo-500 text-white w-14 h-14 rounded-2xl flex flex-col items-center justify-center font-black shadow-lg shadow-indigo-100 text-[10px]"><span className="opacity-70 text-[7px] uppercase tracking-tighter">กลับ</span>{r.return_time}</div>
                        </div>
                        <div className="flex-1">
                          <h3 className="font-black text-slate-800 text-base group-hover:text-blue-700 transition-colors uppercase italic tracking-tight flex items-center gap-2">
                             {r.name}
                             <span className="text-[9px] bg-slate-100 text-slate-500 px-2 py-1 rounded-md not-italic flex items-center gap-1">{getVehicleIcon(r.vehicle_type)} {r.vehicle_type}</span>
                          </h3>
                          <p className="text-[10px] text-slate-500 font-bold mt-1 uppercase tracking-[0.15em]">Plate: {r.plate_number} | Driver: {r.driver_name}</p>
                          <div className="mt-4 flex items-center justify-between">
                            <div className="flex gap-3 items-center">
                               <span className={`text-[10px] font-black px-4 py-2 rounded-xl uppercase tracking-widest ${available <= 0 ? 'bg-red-50 text-red-500 border border-red-100' : 'bg-blue-50 text-blue-600 border border-blue-100'}`}>{available <= 0 ? 'FULL' : `ว่าง ${available} Seats`}</span>
                               <span className="text-xs font-black text-green-600 flex items-center gap-1">
                                  {Banknote && <Banknote className="w-4 h-4"/>} {r.price || 0} ฿ {r.vehicle_type === 'รถบัส' && <span className="text-[9px] font-bold text-slate-400">({busPackage === 'monthly' ? 'รายเดือน' : 'รายสัปดาห์'})</span>}
                               </span>
                            </div>
                          </div>
                        </div>
                      </div>
                  </div>
                )
              })}
              {routes.filter(r => r.trip_date === searchDate && !getCarModelParts(r.car_model).isArchived).length === 0 && (
                 <div className="text-center p-12 bg-slate-100 rounded-[3rem] border border-dashed text-slate-400 font-bold">ไม่พบสายรถบริการในวันที่คุณเลือก</div>
              )}
            </div>
          </div>
        )}
      </main>

      {}
      {/* --- MODAL: CONFIRM BOOKING --- */}
      {showModal && (() => {
        let displayPrice = selectedRoute?.price || 0;
        const { busPackage } = getCarModelParts(selectedRoute?.car_model);
        
        if (bookingTripType === 'one-way' && selectedRoute?.vehicle_type !== 'รถบัส') {
            displayPrice = displayPrice / 2;
        }

        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-2xl animate-in zoom-in-95">
            <div className="bg-white rounded-[3.5rem] w-full max-w-sm overflow-hidden shadow-2xl">
              <div className="bg-blue-600 p-10 text-white text-center">
                 <h3 className="text-3xl font-black mb-1 italic tracking-tighter">ยืนยันการจอง</h3>
                 <p className="text-[10px] font-bold text-blue-100 uppercase tracking-[0.25em] leading-none mt-2 italic">{selectedRoute?.name}</p>
                 <p className="text-sm font-black text-yellow-300 mt-2 bg-blue-800/30 inline-block px-3 py-1 rounded-full">{Calendar && <Calendar className="w-3 h-3 inline"/>} วันที่: {selectedRoute?.trip_date}</p>
              </div>
              <div className="p-8 space-y-6 max-h-[60vh] overflow-y-auto">
                <div className="grid grid-cols-2 gap-4">
                  <button onClick={()=>setBookingTripType('one-way')} className={`py-6 rounded-[2rem] text-[10px] font-black flex flex-col items-center gap-2 transition-all shadow-md ${bookingTripType==='one-way'?'bg-blue-700 text-white border-4 border-blue-400 shadow-blue-200':'bg-slate-50 text-slate-400 border'}`}>{ArrowRight && <ArrowRight className="w-6 h-6" />} ขาไปอย่างเดียว</button>
                  <button onClick={()=>setBookingTripType('round-trip')} className={`py-6 rounded-[2rem] text-[10px] font-black flex flex-col items-center gap-2 transition-all shadow-md ${bookingTripType==='round-trip'?'bg-indigo-700 text-white border-4 border-indigo-400 shadow-indigo-200':'bg-slate-50 text-slate-400 border'}`}>{ArrowRightLeft && <ArrowRightLeft className="w-6 h-6" />} ไปและกลับ</button>
                </div>

                <div className="space-y-1 mt-4">
                   <label className="text-[9px] font-black text-slate-500 uppercase ml-2">ระบุจุดที่จะขึ้นรถ (เพื่อให้คนขับทราบ)</label>
                   <input type="text" placeholder="เช่น หน้าหมู่บ้าน, ปากซอย..." className="w-full bg-slate-50 border-2 rounded-2xl px-4 py-3 text-sm font-bold outline-none focus:border-blue-400" value={pickupLocationStr} onChange={(e) => setPickupLocationStr(e.target.value)} />
                </div>

                <div className="bg-slate-50 p-4 rounded-2xl flex justify-between items-center border border-slate-100">
                   <div>
                     <span className="text-[10px] font-black text-slate-500 uppercase tracking-widest">
                       ค่าโดยสาร <span className="text-blue-500">{bookingTripType === 'one-way' && selectedRoute?.vehicle_type !== 'รถบัส' ? '(ขาเดียว)' : ''}</span>
                     </span>
                     {selectedRoute?.vehicle_type === 'รถบัส' && (
                        <p className="text-[9px] text-indigo-600 font-bold mt-1 bg-indigo-50 inline-block px-2 py-1 rounded">
                           แพ็กเกจ: {busPackage === 'monthly' ? 'รายเดือน' : 'รายสัปดาห์'}
                        </p>
                     )}
                   </div>
                   <span className="text-2xl font-black text-green-600">
                     {displayPrice} ฿
                   </span>
                </div>

                <button onClick={()=>submitBooking(selectedRoute)} disabled={loading} className="w-full bg-blue-700 text-white py-5 rounded-[2rem] font-black shadow-2xl text-[12px] uppercase tracking-[0.2em] active:scale-95 transition-transform">{loading ? "PROCESSING..." : "CONFIRM BOOKING"}</button>
                <button onClick={()=>{setShowModal(false); setPickupLocationStr('');}} className="w-full text-slate-400 text-[10px] font-black uppercase pt-2 tracking-widest hover:text-red-500 transition-colors">ยกเลิกรายการ</button>
              </div>
            </div>
          </div>
        );
      })()}

      {}
      {/* --- MODAL: ADD DRIVER TRIP --- */}
      {showAddTripModal && (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-2xl animate-in zoom-in-95">
          <div className="bg-white rounded-[3rem] w-full max-w-sm overflow-hidden shadow-2xl p-8 space-y-4 max-h-[90vh] overflow-y-auto">
             <h3 className="text-2xl font-black text-slate-800 mb-4 flex items-center gap-2">{CopyPlus && <CopyPlus className="w-6 h-6 text-blue-600" />} เพิ่มรอบเดินรถใหม่</h3>
             <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-4">กำหนดวันเดินทางของรอบใหม่โดยใช้ข้อมูลรถเดิมของคุณ</p>
             
             <div className="space-y-1">
                <label className="text-[9px] font-black text-slate-500 uppercase ml-2">วันที่ออกเดินทาง (จองล่วงหน้า)</label>
                <input type="date" min={getTodayDateStr()} className="w-full bg-slate-50 border-2 rounded-2xl px-5 py-4 text-sm font-bold outline-none focus:border-blue-400" value={drvReg.tripDate} onChange={(e)=>setDrvReg({...drvReg, tripDate: e.target.value})} />
             </div>
             
             <div className="grid grid-cols-2 gap-4 pt-2">
                <div className="space-y-1"><label className="text-[9px] font-black text-slate-500 uppercase ml-2">เวลาขาไป</label><input type="time" className="w-full bg-slate-50 border-2 rounded-2xl px-4 py-3 text-sm font-bold outline-none" value={drvReg.depTime} onChange={(e)=>setDrvReg({...drvReg, depTime: e.target.value})} /></div>
                <div className="space-y-1"><label className="text-[9px] font-black text-slate-500 uppercase ml-2">เวลากลับ</label><input type="time" className="w-full bg-slate-50 border-2 rounded-2xl px-4 py-3 text-sm font-bold outline-none" value={drvReg.retTime} onChange={(e)=>setDrvReg({...drvReg, retTime: e.target.value})} /></div>
             </div>
             
             {drvReg.vehicleType !== 'รถบัส' ? (
                 <div className="space-y-1 pt-2">
                    <label className="text-[9px] font-black text-slate-500 uppercase ml-2">ค่าโดยสารรายวัน (บาท)</label>
                    <input type="number" className="w-full bg-slate-50 border-2 rounded-2xl px-5 py-4 text-sm font-bold outline-none focus:border-blue-400" value={drvReg.price} onChange={(e)=>setDrvReg({...drvReg, price: e.target.value})} />
                 </div>
             ) : (
                <div className="col-span-2 grid gap-4 bg-indigo-50 p-4 rounded-2xl border border-indigo-100 mt-2">
                   <div className="space-y-1">
                      <label className="text-[9px] font-black text-indigo-500 uppercase ml-2">รูปแบบค่าโดยสาร (รถบัส)</label>
                      <select 
                        className="w-full bg-white rounded-2xl px-4 py-3 text-sm font-bold outline-none focus:border-indigo-400"
                        value={drvReg.busPackage || 'weekly'}
                        onChange={(e)=>setDrvReg({...drvReg, busPackage: e.target.value})}
                      >
                        <option value="weekly">รายสัปดาห์ (225 บาท)</option>
                        <option value="monthly">รายเดือน (900 บาท)</option>
                      </select>
                   </div>
                   <p className="text-[10px] text-indigo-600 font-bold ml-2">
                     * วันที่สิ้นสุดรอบเหมาจ่าย: {getEndDateStr(drvReg.tripDate, drvReg.busPackage === 'monthly' ? 30 : 7)}
                   </p>
                </div>
             )}

             <div className="pt-4">
                <button onClick={handleDrvReg} disabled={loading} className="w-full bg-blue-600 text-white py-4 rounded-[1.5rem] font-black shadow-xl active:scale-95 transition-transform">{loading ? "กำลังบันทึก..." : "ยืนยันเพิ่มรอบรถ"}</button>
                <button onClick={()=>setShowAddTripModal(false)} className="w-full text-slate-400 text-[10px] font-black uppercase mt-4 hover:text-red-500 transition-colors">ยกเลิก</button>
             </div>
          </div>
        </div>
      )}
    </div>
  );
};

// ตรวจสอบและเรนเดอร์ React App เมื่อโหลดเสร็จ
if (window.lucideReact) {
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
} else {
    // กำหนด Timeout เพื่อรอ Lucide โหลดเสร็จ (เผื่ออินเทอร์เน็ตช้า)
    setTimeout(() => {
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    }, 1000);
}
  </script>
</body>
</html>
